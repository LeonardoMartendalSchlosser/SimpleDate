[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simpledate-m3"
version = "0.1.0"
description = "Uma biblioteca simples para manipulação de datas em Python."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT License"}
authors = [
  {name = "Leonardo Martendal Schlosser", email = "lmartendalaschlosser@gmail.com"}
]
keywords = ["date", "utils", "datas"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha"
]

[project.urls]
Homepage = "https://github.com/LeonardoMartendalSchlosser/simpledate"
